<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Panier multi-vendeurs</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body {
  margin: 0;
  font-family: Inter, sans-serif;
  color: #202923;
}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #F5F7F6; display: flex; flex-direction: column; overflow: hidden">
<div style="background: #fff; padding: 14px 16px; font-size: 18px; font-weight: 700">Mon panier (2 articles)</div>
<div style="flex: 1; padding: 12px 16px; display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
<div style="background: #fff; border: 1px solid #E3E8E5; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px">
<div style="font-weight: 700; font-size: 14px">{{g.v}} <span style="color: #0E5A35; font-weight: 600; font-size: 12px">✓ vérifié</span></div>
<sc-for list="{{g.items}}" as="i" hint-placeholder-count="1">
<div style="display: flex; gap: 10px; align-items: center">
<div style="width: 56px; height: 56px; background: #E6F4EC; border-radius: 8px"></div>
<div style="flex: 1; font-size: 13px"><b>{{i.n}}</b><br>{{i.var}} · Qté {{i.q}}</div>
<div style="font-weight: 700; font-size: 13px">{{i.px}} FCFA</div>
</div>
</sc-for>
<div style="border-top: 1px solid #E3E8E5; padding-top: 8px; font-size: 13px; display: flex; justify-content: space-between"><span>Sous-total · Livraison estimée {{g.liv}} FCFA</span><b>{{g.st}}</b></div>
</div>
</sc-for>
</div>
<div style="background: #fff; border-top: 1px solid #E3E8E5; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; font-size: 16px; font-weight: 700"><span>Total</span><span style="color: #137547">28 500 FCFA</span></div>
<a href="Paiement.dc.html" style="background: #137547; color: #fff; text-align: center; text-decoration: none; font-weight: 600; border-radius: 10px; min-height: 48px; display: flex; align-items: center; justify-content: center">Commander</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { groups: [
      { v: 'Boutique Démo A', liv: '1 500', st: '14 000 FCFA', items: [{ n: 'Pagne wax 6 yards', var: 'Bleu', q: 1, px: '12 500' }] },
      { v: 'Boutique Démo B', liv: '1 500', st: '14 500 FCFA', items: [{ n: 'Baskets homme', var: 'Noir · 42', q: 1, px: '13 000' }] }
    ] };
  }
}
</script>
</body>
</html>
