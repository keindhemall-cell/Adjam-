<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Fiche produit</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body {
  margin: 0;
  font-family: Inter, sans-serif;
  color: #202923;
}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #fff; display: flex; flex-direction: column; overflow: hidden">
<a href="Main.dc.html" style="padding: 14px 16px; color: #137547; font-weight: 600; text-decoration: none; min-height: 44px; box-sizing: border-box">← Retour</a>
<div style="height: 280px; background: #E6F4EC; display: flex; align-items: center; justify-content: center; color: #5B665F; font-size: 13px">Galerie photos (1/4) — image de démonstration</div>
<div style="padding: 16px; display: flex; flex-direction: column; gap: 12px; flex: 1">
<div style="font-size: 20px; font-weight: 700">Pagne wax 6 yards — motif floral</div>
<div style="display: flex; align-items: baseline; gap: 10px"><span style="font-size: 24px; font-weight: 700; color: #137547">12 500 FCFA</span><span style="background: #F59E0B; color: #202923; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 6px">-20 %</span></div>
<div style="font-size: 13px">Vendu par <b>Boutique Démo A</b> · <span style="background: #E6F4EC; color: #0E5A35; padding: 2px 8px; border-radius: 10px; font-weight: 600">✓ Vendeur vérifié</span></div>
<div style="font-size: 13px; font-weight: 600">Couleur</div>
<div style="display: flex; gap: 8px">
<sc-for list="{{colors}}" as="c" hint-placeholder-count="3">
<div style="min-height: 44px; padding: 0 16px; display: flex; align-items: center; border: 1px solid {{c.b}}; background: {{c.bg}}; border-radius: 10px; font-size: 14px; font-weight: 600">{{c.n}}</div>
</sc-for>
</div>
<div style="font-size: 13px; color: #5B665F">En stock · Livraison estimée : 24 à 48 h · Retour possible sous 7 jours (hypothèse)</div>
</div>
<div style="padding: 12px 16px; border-top: 1px solid #E3E8E5; display: flex; gap: 12px; align-items: center">
<div style="border: 1px solid #D5DDD8; border-radius: 10px; min-height: 48px; padding: 0 16px; display: flex; align-items: center; gap: 14px; font-weight: 600">− 1 +</div>
<a href="Panier.dc.html" style="flex: 1; background: #137547; color: #fff; text-align: center; text-decoration: none; font-weight: 600; border-radius: 10px; min-height: 48px; display: flex; align-items: center; justify-content: center">Ajouter au panier</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { colors: [
      { n: 'Bleu', b: '#137547', bg: '#E6F4EC' },
      { n: 'Rouge', b: '#D5DDD8', bg: '#fff' },
      { n: 'Jaune', b: '#D5DDD8', bg: '#fff' }
    ] };
  }
}
</script>
</body>
</html>
